name: Gold News Bot

on:
  schedule:
    - cron: '4-59/15 * * * *'   # tiap 15 menit, digeser biar tidak bentrok commit sama bot lain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Cek & kirim berita relevan
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gold_news.py

      - name: Simpan daftar berita yang sudah dikirim
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news_seen.json
          git diff --staged --quiet || git commit -m "Update news state [skip ci]"
          git pull --rebase origin main || true
          git push
