name: Telegram Journal Bot

on:
  schedule:
    - cron: '2-59/5 * * * *'   # jalan tiap 5 menit, digeser 2 menit dari Gold Signal Bot biar tidak bentrok commit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-journal-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Cek pesan & update jurnal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_journal.py

      - name: Simpan perubahan jurnal
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal_data.json journal_offset.json
          git diff --staged --quiet || git commit -m "Update journal [skip ci]"
          git pull --rebase origin main || true
          git push
